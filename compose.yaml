services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - library-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U library']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  library-db:
